name: Managed build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore .\Ut4Recon.sln
      - name: Build
        run: dotnet build .\Ut4Recon.sln -c Release --no-restore
      - name: Test public suite
        run: dotnet test .\Ut4Recon.sln -c Release --no-build --verbosity normal
